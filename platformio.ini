; PlatformIO Project Configuration File - UTECO Receiver Base Station
[platformio]
default_envs = uno, uno-bench, uno-debug

[common]
monitor_speed = 115200
lib_deps =
    nrf24/RF24 @ ^1.4.10

; --- Production Field Range (Maximum Power +20 dBm amplified) ---
[env:uno]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
monitor_speed = ${common.monitor_speed}
build_flags =
    -Os -ffunction-sections -fdata-sections -Wl,--gc-sections
    -D NODE_ROLE_RX
    -D TEST=0
    -D CHANNEL=78
    -D RF24_PA_LEVEL_DEFAULT=RF24_PA_MAX
    -D RF24_DATARATE_DEFAULT=RF24_250KBPS

; --- Bench Testing (Low Power ~+6 dBm to prevent receiver LNA saturation at < 2m) ---
[env:uno-bench]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
monitor_speed = ${common.monitor_speed}
build_flags =
    -Os -ffunction-sections -fdata-sections -Wl,--gc-sections
    -D NODE_ROLE_RX
    -D TEST=0
    -D CHANNEL=78
    -D RF24_PA_LEVEL_DEFAULT=RF24_PA_MIN
    -D RF24_DATARATE_DEFAULT=RF24_250KBPS

; --- Diagnostic / Debug Mode ---
[env:uno-debug]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
monitor_speed = ${common.monitor_speed}
build_flags =
    -Os -ffunction-sections -fdata-sections -Wl,--gc-sections
    -D NODE_ROLE_RX
    -D TEST=1
    -D CHANNEL=78
    -D RF24_PA_LEVEL_DEFAULT=RF24_PA_MIN
    -D RF24_DATARATE_DEFAULT=RF24_250KBPS

; --- Native Host Unit Tests ---
[env:native]
platform = native
build_flags =
    -I test/mocks
    -I src
    -D NODE_ROLE_RX
    -D __AVR_ATmega328P__
    -D CHANNEL=78
    -D RF24_PA_LEVEL_DEFAULT=RF24_PA_MAX
    -D RF24_DATARATE_DEFAULT=RF24_1MBPS
test_framework = unity
